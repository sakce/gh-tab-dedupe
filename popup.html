<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2328;
        --muted: #59636e;
        --border: #d1d9e0;
        --primary: #1f883d;
        --primary-hover: #1c8139;
        --primary-fg: #ffffff;
        --track: #d1d9e0;
        --knob: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #151b23;
          --fg: #f0f6fc;
          --muted: #9198a1;
          --border: #3d444d;
          --primary: #238636;
          --primary-hover: #29903b;
          --track: #3d444d;
          --knob: #f0f6fc;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 260px;
        margin: 0;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      header {
        padding: 10px 14px;
        font-weight: 600;
        border-bottom: 1px solid var(--border);
      }
      section {
        padding: 14px;
      }
      section + section {
        border-top: 1px solid var(--border);
      }
      button {
        width: 100%;
        padding: 7px 12px;
        font: inherit;
        font-weight: 500;
        color: var(--primary-fg);
        background: var(--primary);
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover {
        background: var(--primary-hover);
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      kbd {
        padding: 1px 5px;
        font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      .toggle {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
      }
      .toggle input {
        position: absolute;
        opacity: 0;
      }
      .switch {
        position: relative;
        width: 32px;
        height: 18px;
        border-radius: 9px;
        background: var(--track);
        transition: background 0.15s;
      }
      .switch::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--knob);
        transition: transform 0.15s;
      }
      .toggle input:checked + .switch {
        background: var(--primary);
      }
      .toggle input:checked + .switch::after {
        transform: translateX(14px);
      }
      .toggle input:focus-visible + .switch {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .switch,
        .switch::after {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <header>GitHub tab dedupe</header>
    <section>
      <button id="close">Close duplicate tabs</button>
      <div class="hint" id="status"></div>
    </section>
    <section>
      <label class="toggle">
        <span>Pause tab switching</span>
        <input type="checkbox" id="paused" />
        <span class="switch"></span>
      </label>
    </section>
    <script src="popup.js"></script>
  </body>
</html>
