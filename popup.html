<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 240px;
        margin: 0;
        padding: 12px;
        font: 13px system-ui, sans-serif;
        color: #1f2328;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #e6edf3;
          background: #0d1117;
        }
        button {
          color: #e6edf3;
          background: #21262d;
          border-color: #30363d;
        }
      }
      button {
        width: 100%;
        padding: 6px 10px;
        font: inherit;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        cursor: pointer;
      }
      label {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-top: 12px;
        cursor: pointer;
      }
      .hint {
        margin-top: 6px;
        min-height: 1em;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <button id="close">Close duplicate tabs</button>
    <div class="hint" id="status"></div>
    <label><input type="checkbox" id="paused" /> Pause tab switching</label>
    <script src="popup.js"></script>
  </body>
</html>
